<meta charset="utf-8">
<style>
  :root{
    --ink:#11140f; --paper:#f4f1e8; --paper2:#ece7d8;
    --rust:#9c3b1b; --rust2:#c2531f; --moss:#3a4a2a; --gold:#b8862b;
    --line:#1d1f18; --shadow:rgba(20,18,12,.18);
    --got:#3a5a32; --shaky:#9a6a12; --missed:#8f2b16;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #app{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--ink); background:
      radial-gradient(circle at 18% 12%, rgba(184,134,43,.07), transparent 42%),
      radial-gradient(circle at 82% 88%, rgba(156,59,27,.06), transparent 46%),
      var(--paper);
    min-height:100vh; padding:clamp(14px,3vw,40px);
    background-attachment:fixed;
  }
  .wrap{max-width:780px;margin:0 auto}
  .masthead{border-bottom:3px double var(--line);padding-bottom:14px;margin-bottom:6px}
  .kicker{font-family:"Courier New",monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--rust);font-weight:700}
  h1{font-size:clamp(26px,5vw,40px);line-height:1.02;font-weight:800;letter-spacing:-.01em;margin:6px 0 2px}
  .sub{font-style:italic;color:#544f40;font-size:14px}
  .meterbar{display:flex;gap:10px;align-items:center;margin:16px 0 22px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5444}
  .track{flex:1;height:7px;background:var(--paper2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--rust),var(--gold));width:0;transition:width .4s ease}
  .card{background:linear-gradient(180deg,#fbf9f1,#f1ece0);border:1px solid var(--line);border-radius:4px;
    box-shadow:6px 7px 0 var(--shadow);padding:clamp(20px,4vw,34px);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(20,18,12,.025) 1px,transparent 1px);background-size:4px 4px;pointer-events:none}
  .tagrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .cat{font-family:"Courier New",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--moss);font-weight:700}
  .prio{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--rust);color:var(--rust);border-radius:2px}
  .qtext{font-size:clamp(20px,3.4vw,27px);line-height:1.28;font-weight:600;margin:4px 0 10px}
  .prompt{font-style:italic;color:#6a6353;font-size:14px;margin-top:18px;border-top:1px dashed #b7b09a;padding-top:14px}
  .reveal{margin-top:22px;border-top:2px solid var(--line);padding-top:18px;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rlabel{font-family:"Courier New",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rust);font-weight:700;margin-bottom:8px}
  .answer{font-size:16.5px;line-height:1.55}
  .warn{margin-top:16px;background:rgba(156,59,27,.07);border-left:4px solid var(--rust);padding:11px 14px;font-size:14.5px;line-height:1.5}
  .warn b{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);display:block;margin-bottom:4px}
  .btnrow{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  button{font-family:"Courier New",monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    padding:13px 20px;border:1px solid var(--line);border-radius:3px;cursor:pointer;background:var(--ink);color:var(--paper);
    box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
  button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
  button.ghost{background:transparent;color:var(--ink)}
  .grade{flex:1;min-width:120px;color:#fff}
  .g-got{background:var(--got);border-color:var(--got)}
  .g-shaky{background:var(--shaky);border-color:var(--shaky)}
  .g-missed{background:var(--missed);border-color:var(--missed)}
  .end h2{font-size:clamp(24px,4vw,34px);margin-bottom:4px}
  .scoreline{font-family:"Courier New",monospace;font-size:14px;letter-spacing:.06em;margin:18px 0;line-height:2}
  .pill{display:inline-block;padding:2px 10px;border-radius:2px;font-weight:700;margin-left:6px}
  .catbreak{margin-top:20px}
  .catrow{display:flex;align-items:center;gap:10px;font-family:"Courier New",monospace;font-size:12px;margin:7px 0}
  .catname{flex:0 0 200px;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
  .catbar{flex:1;height:14px;background:var(--paper2);border:1px solid var(--line);border-radius:2px;overflow:hidden;display:flex}
  .seg{height:100%}
  .footnote{margin-top:26px;font-size:12px;font-style:italic;color:#6a6353;border-top:1px dashed #b7b09a;padding-top:12px;line-height:1.5}
</style>
<div id="app"><div class="wrap"><a href="/quiz/" style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-decoration:none;display:inline-block;margin-bottom:14px">&larr; Back to Quiz</a><div id="root"></div></div></div>
<script>
var BANK=[{"id": 1, "cat": "Contribution & framing", "weight": 3, "q": "In two sentences, what is the contribution of this thesis?", "a": "It tests classic cyber-aggression predictors alongside novel AI-related constructs and personality in a single hierarchical model predicting hostile response likelihood, and shows moral disengagement dominates while the AI block adds no incremental variance. The secondary contribution is the MIRM mediation-dissociation finding: an AI-venting signal that predicts lower hostility independently of the cognitive-script pathway.", "warn": "Lead with the empirical finding, not MIRM. MIRM is secondary and contested."}, {"id": 2, "cat": "Contribution & framing", "weight": 2, "q": "Why does this study matter beyond the existing cyber-aggression literature?", "a": "It extends moral disengagement from adolescent samples into a higher-education population and tests whether AI-interaction constructs add anything over established predictors. The null AI result is itself informative: it tells the field the first-generation AI instruments do not yet capture variance in hostility.", "warn": ""}, {"id": 3, "cat": "Contribution & framing", "weight": 2, "q": "Who is the intended audience for this work and what should they take from it?", "a": "Cyberpsychology researchers and instrument developers. The takeaway is that moral disengagement is the cognitive gateway and that AI constructs need measurement work before they can earn a place in predictive models.", "warn": ""}, {"id": 4, "cat": "Contribution & framing", "weight": 1, "q": "If you had to defend this thesis on a single finding, which would it be and why?", "a": "Moral disengagement as the dominant predictor (B = 1.229, t = 2.412, p = .019; standardised beta approx .466), because it is robust, theoretically grounded in Bandura, and survives entry of competing AI and personality blocks.", "warn": ""}, {"id": 5, "cat": "Contribution & framing", "weight": 1, "q": "What is the single biggest weakness of the thesis, in your own assessment?", "a": "The AI-construct instrumentation. The block was null and I argue this is measurement failure rather than absence of effect, but cross-sectionally I cannot fully separate those two explanations. That is why the experimental follow-up exists.", "warn": "Volunteering this first is strength. Do not get cornered into it."}, {"id": 6, "cat": "Anonymity anomaly", "weight": 3, "q": "Your anonymity coefficient is negative. You predicted positive. Explain.", "a": "Perceived anonymity predicted lower hostile response likelihood (B = -1.175, SE = 0.521, t = -2.255, p = .028; standardised beta approx -.214). This contradicts Suler's online disinhibition account. I keep H1 as the theory-derived directional prediction and treat the reversal as a substantive finding requiring explanation, not as a failed hypothesis to be hidden.", "warn": "State the number and the p-value without prompting. Do not hedge on the direction."}, {"id": 7, "cat": "Anonymity anomaly", "weight": 3, "q": "Is the negative anonymity effect real, or a measurement artefact?", "a": "I cannot rule out measurement entirely, but the effect is significant (p = .028) and survives the full classic block. The Pan et al. (2023) finding that anonymity can enhance moral courage gives a theoretical route: anonymity may reduce reputational stakes that otherwise license retaliation. I present it as anomalous and theoretically open, not resolved.", "warn": "Do not claim a mechanism you did not test. 'Consistent with', not 'because of'."}, {"id": 8, "cat": "Anonymity anomaly", "weight": 2, "q": "What does 'theory lags infrastructure' mean and why is it in Chapter 2 rather than Chapter 5?", "a": "Disinhibition theory was formed on an earlier internet architecture; today's identified, platform-mediated environments may invert anonymity's effect. I place the argument in Chapter 2 so the anomaly is anticipated by the framing rather than rescued post hoc in the discussion.", "warn": "This is the protective placement. Be ready to justify it as pre-emptive, not opportunistic."}, {"id": 9, "cat": "Anonymity anomaly", "weight": 2, "q": "How do you reconcile your anonymity finding with the SIDE model?", "a": "SIDE predicts anonymity amplifies salient group norms rather than uniformly increasing aggression. If the salient norm in a university sample is non-hostile, SIDE actually predicts anonymity could lower hostility, which is broadly consistent with my negative coefficient.", "warn": ""}, {"id": 10, "cat": "Anonymity anomaly", "weight": 1, "q": "Could the anonymity item simply be measuring something other than anonymity?", "a": "Possibly. It may tap perceived consequence-freedom rather than identity concealment. I flag this as a construct-validity limitation and a target for the multi-item replacement in future work.", "warn": ""}, {"id": 11, "cat": "Anonymity anomaly", "weight": 1, "q": "If you re-ran this and anonymity came out positive, what would you conclude?", "a": "That the present sample or instrument produced an unstable estimate, and I would weight the meta-analytic Suler-consistent direction. A single anomalous coefficient is a prompt for replication, not a refutation of disinhibition theory.", "warn": ""}, {"id": 12, "cat": "Anonymity anomaly", "weight": 1, "q": "Why not simply drop the anonymity hypothesis given the reversal?", "a": "Dropping it would be results-driven hypothesising. The honest record is that theory predicted positive, data showed negative, and the discrepancy is the interesting result.", "warn": ""}, {"id": 13, "cat": "CAI to HRL switch", "weight": 3, "q": "Your outcome changed from the pre-registered CAI scale to a single-item HRL. Justify this.", "a": "The change happened during instrument development, before any data collection. No CAI data were ever collected, so the outcome cannot have been chosen to fit results. HRL operationalises Grigg's cyber-aggression construct through a scenario-based route consistent with Tennakoon et al.'s closing recommendation.", "warn": "Say 'before data collection' and 'no CAI data ever collected' explicitly. This is the whole defence."}, {"id": 14, "cat": "CAI to HRL switch", "weight": 3, "q": "A single-item dependent variable is psychometrically weak. Defend it.", "a": "Single-item measures are defensible for concrete, narrow constructs and reduce respondent fatigue in a vignette design. HRL is anchored to a specific scenario, which constrains interpretation. I acknowledge the reliability limitation and treat it as a bound on, not a refutation of, the findings.", "warn": "Concede the limitation. Do not pretend a single item is as good as a scale."}, {"id": 14.5, "cat": "CAI to HRL switch", "weight": 1, "q": "How would you estimate reliability for a single-item outcome?", "a": "Classical alpha is undefined for one item. I rely on the construct's narrowness and scenario-anchoring for content validity, and I note test-retest would be the appropriate reliability check in future work.", "warn": ""}, {"id": 15, "cat": "CAI to HRL switch", "weight": 2, "q": "Walk me through the timeline that proves the switch was not results-driven.", "a": "Instrument development and the CAI-to-HRL decision are documented before data collection opened. The first valid responses postdate the decision. The documentary trail is in the methodology and the AI-use log.", "warn": "Have the dates ready. Vagueness here is fatal."}, {"id": 16, "cat": "CAI to HRL switch", "weight": 2, "q": "Does the Grigg construct survive the move to HRL?", "a": "Yes. Grigg (2010) defines cyber-aggression conceptually; HRL is one operationalisation of that definition via scenario-based response likelihood. The construct is preserved; only the measurement route changed.", "warn": ""}, {"id": 17, "cat": "CAI to HRL switch", "weight": 1, "q": "Why is HRL scored 1 to 10 rather than on the 1 to 5 Likert scale used elsewhere?", "a": "A wider response range gives the outcome more discriminating power as the sole DV, while predictor scales stay on their validated 1 to 5 metric. The mixed scaling is handled by standardisation in the regression.", "warn": ""}, {"id": 18, "cat": "CAI to HRL switch", "weight": 1, "q": "What did you lose by abandoning CAI?", "a": "Multi-item reliability and direct comparability to studies using CAI. What I gained was a cleaner scenario-anchored outcome and freedom from a scale that was underperforming in development.", "warn": ""}, {"id": 19, "cat": "AI-block null result", "weight": 3, "q": "The entire AI construct block was non-significant. Why is that not just a failed hypothesis?", "a": "The AI block added ΔR² = .016, F(3,124) = 0.87, p = .46. I frame this as measurement validity failure because the constructs were measured with first-generation, partly self-authored items lacking established psychometric pedigree. A null from weak instruments is uninformative about the underlying theory.", "warn": "You must be able to distinguish 'measurement failed' from 'theory wrong'. Have the discriminant evidence ready (next Q)."}, {"id": 20, "cat": "AI-block null result", "weight": 3, "q": "How do you know the AI null is measurement failure and not simply that AI constructs do not predict hostility?", "a": "Two lines. First, the AD5 venting item produced a significant zero-order signal (r = -.203, p = .0155) and survived full cognitive-script controls (B = -0.374, p = .030), so at least one AI item carries real variance. Second, power for the block was only .243 at the observed f-squared, so the null is as consistent with under-detection as with true absence.", "warn": "This is the crux question. If you cannot answer it cleanly the null reads as theory failure."}, {"id": 21, "cat": "AI-block null result", "weight": 2, "q": "What was statistical power for detecting the AI block effect?", "a": ".243 at the observed f-squared of .021. Power for the classic block effect (f-squared .304) was .997. The asymmetry means the design was well powered for classic predictors and badly underpowered for the small AI effect.", "warn": "Know both power figures. The contrast is your friend."}, {"id": 22, "cat": "AI-block null result", "weight": 2, "q": "If the AI block is null, why keep it in the thesis at all?", "a": "Because a documented, transparently reported null on novel constructs is a contribution: it tells the field the instruments need development before the constructs can be tested fairly. Suppressing it would be a worse scientific practice.", "warn": ""}, {"id": 23, "cat": "AI-block null result", "weight": 1, "q": "Which AI construct, if any, showed the most promise?", "a": "AI disinhibition, specifically the AD5 venting item, which carried the only reliable AI-side signal and anchors the MIRM mediation-dissociation analysis.", "warn": ""}, {"id": 24, "cat": "AI-block null result", "weight": 1, "q": "Could the AI null be a sample issue rather than a measurement issue?", "a": "A student sample with relatively homogeneous AI exposure could restrict range and depress the effect. That is a sampling contributor to the same conclusion: the cross-sectional design cannot adjudicate, so the experimental study is required.", "warn": ""}, {"id": 25, "cat": "AI-block null result", "weight": 1, "q": "Reviewers often distrust 'measurement failure' as an excuse for a null. Why should I believe you?", "a": "Because I commit to it as a testable claim, not a shield: the follow-up study replaces the items with psychometrically developed scales, and if the effect stays null under good measurement, the theory is wrong. Flake and Fried (2020) is the standard I am holding myself to.", "warn": ""}, {"id": 26, "cat": "MIRM / model comparison", "weight": 3, "q": "Does MIRM improve on the additive GAM model?", "a": "No, not on fit. Canonical layered comparison: GAM R² = .209 with the best AIC (663.2). The I-cubed interaction layer added nothing (ΔR² = .022, p = .43). The MIRM regulatory layer was borderline (ΔR² = .033, p = .0554) and lost to the parsimonious GAM on AIC. MIRM is not justified as an incremental-variance improvement.", "warn": "Say 'no' first. The moment you imply MIRM beats GAM on fit, an external who knows model comparison ends you."}, {"id": 27, "cat": "MIRM / model comparison", "weight": 3, "q": "Then what is MIRM actually for, if it does not beat GAM?", "a": "Its genuine independent contribution is the mediation dissociation. AI venting predicts lower hostility net of the full cognitive-script pathway (MD, normalisation, empathy, anonymity): B = -0.374, standardised beta = -0.167, p = .030. MD lives among cognitive-script constructs; venting lives with neuroticism. They occupy structurally different neighbourhoods, which is a pattern neither pure GAM nor pure I-cubed predicts.", "warn": "'Consistent with regulation as a distinct mechanism', never 'proves'. Cross-sectional cannot confirm."}, {"id": 28, "cat": "MIRM / model comparison", "weight": 2, "q": "Your boundary-condition test only works under a median split. Is that not a red flag?", "a": "Yes, and I disclose it. The continuous venting-by-impellance interaction was non-significant (beta = -0.31, p = .18). The effect appears only via median split: high-impellance subgroup (n = 40) slope approx -1.20, p = .005; low-impellance (n = 102) non-significant; bootstrap difference p approx .03. Double fragility: split-only, and the impellor (neuroticism) is empirically weak against HRL. I weight this to the experimental study.", "warn": "Disclose BOTH fragilities unprompted. This is the most overclaim-prone result in the thesis."}, {"id": 29, "cat": "MIRM / model comparison", "weight": 2, "q": "Why propose a new framework (MIRM) when I-cubed already exists and your data do not support the multiplicative core?", "a": "MIRM is positioned as a cybercommunications regulatory extension, not a replacement, and I am explicit that the cross-sectional data support only the regulatory dissociation leg, not the multiplicative interaction core. The framework is a structured prediction set for the three-study programme, not a claim of confirmed superiority.", "warn": "Demote, don't drop. Frame MIRM as a hypothesis-generator, not a validated model."}, {"id": 30, "cat": "MIRM / model comparison", "weight": 2, "q": "What is the difference between MIRM and Finkel's I-cubed?", "a": "I-cubed organises aggression into instigation, impellance, and inhibition with a multiplicative core. MIRM adds a regulatory substrate specific to computer-mediated channels, hypothesising that AI mediation can supply external regulation that modulates the inhibition term. The dissertation tests MIRM; the inter-personal companion idea (Babel Fish Theory) is a separate paper.", "warn": "Keep BFT out of the viva unless asked. It is not in the thesis."}, {"id": 31, "cat": "MIRM / model comparison", "weight": 1, "q": "Earlier drafts cited beta = -.452 for the residual venting effect. Why does your thesis say -0.374?", "a": "The -.452 was a loose-run figure with a raw-versus-standardised mislabel. The canonical value is raw B = -0.374, standardised beta = -0.167, p = .0303. Only the canonical figure appears in the thesis.", "warn": "If this surfaces, owning the correction shows rigour. Never quote -.452."}, {"id": 32, "cat": "MIRM / model comparison", "weight": 1, "q": "Can a cross-sectional design ever support a mediation claim like MIRM's?", "a": "It can show patterns consistent with mediation but cannot establish causal direction. I state plainly that definitive tests require the experimental and experience-sampling studies. The cross-sectional result is a consistency check, not a confirmation.", "warn": ""}, {"id": 33, "cat": "MIRM / model comparison", "weight": 1, "q": "Why report MIRM at all if it is this fragile?", "a": "Because the dissociation leg is genuinely independent and significant, and because transparent reporting of a borderline framework is more defensible than either suppressing it or overselling it. The fragility is disclosed, not hidden.", "warn": ""}, {"id": 34, "cat": "MIRM / model comparison", "weight": 1, "q": "What AIC difference would you have needed to claim MIRM superiority?", "a": "Conventionally a difference of at least 2 to 4 in MIRM's favour. Instead GAM had the lowest AIC, so the parsimony criterion favours the simpler model and I report that against my own framework.", "warn": ""}, {"id": 35, "cat": "Moral disengagement", "weight": 3, "q": "Why does moral disengagement dominate every model?", "a": "Standardised beta approx .466 in the full model, B = 1.229, t = 2.412, p = .019. Theoretically it may be the cognitive gateway through which other risk factors operate (Bandura): if anonymity, empathy deficit, and normalisation influence hostility partly through moral disengagement, MD should dominate any model containing both cognitive and environmental variables, which is what the data show.", "warn": ""}, {"id": 36, "cat": "Moral disengagement", "weight": 2, "q": "Which Bandura mechanisms of moral disengagement are most relevant to your items?", "a": "Moral justification, euphemistic labelling, displacement of responsibility, and attribution of blame map most directly onto online retaliation scenarios. Bandura et al. (1996) is the measurement lineage.", "warn": ""}, {"id": 37, "cat": "Moral disengagement", "weight": 2, "q": "Tell me about the md2 item problem.", "a": "The md2 item ('justified in attacking them back') correlates with HRL at r = .49 versus .14 to .33 for the other MD items. It is effectively a trace of the original CAI outcome embedded in the predictor block. I run a sensitivity refit of Model 5 without md2 and report it as a Section 4.5 footnote so the MD effect is shown not to depend on a contaminated item.", "warn": "Raise this yourself. An examiner who spots it unprompted is worse than you disclosing it."}, {"id": 38, "cat": "Moral disengagement", "weight": 1, "q": "Does the MD effect survive removing md2?", "a": "Yes; the sensitivity refit retains a significant MD effect, which is the point of reporting it. MD dominance is not an artefact of the single high-correlating item.", "warn": "Confirm against the 00_prep_md5.R output before the viva. Do not state the surviving beta from memory."}, {"id": 39, "cat": "Moral disengagement", "weight": 1, "q": "Is moral disengagement a cause or a correlate of hostility here?", "a": "Cross-sectionally, a correlate. The gateway interpretation is theoretical. I do not claim causation from these data.", "warn": ""}, {"id": 40, "cat": "Moral disengagement", "weight": 1, "q": "How does extending MD to a higher-education sample add value, given the adolescent literature?", "a": "It demonstrates the construct retains predictive power in adults and in a context with novel AI and personality competitors in the model, which the adolescent work did not test.", "warn": ""}, {"id": 41, "cat": "Method & design", "weight": 3, "q": "Why a vignette-based survey rather than a behavioural or experimental design?", "a": "Vignettes give standardised, ethically safe exposure to provocation that could not be staged behaviourally without harm. Aguinis and Bradley (2014) set the design standard I follow. The trade-off is that intentions are not behaviour, which I state.", "warn": ""}, {"id": 42, "cat": "Method & design", "weight": 2, "q": "How did you guard against the gap between stated intention and actual behaviour?", "a": "I cannot close it cross-sectionally. I anchor HRL to a concrete scenario to reduce abstraction, and I treat the outcome as response likelihood, not enacted aggression, throughout the claims.", "warn": ""}, {"id": 43, "cat": "Method & design", "weight": 2, "q": "Walk me through your analytic strategy.", "a": "Hierarchical regression entering classic predictors, then the AI block, then personality, with HRL as the sole DV. Reliability and descriptives first, then the blocked models, then MIRM exploratory tests (layered comparison, mediation dissociation, boundary condition), then sensitivity refits.", "warn": ""}, {"id": 44, "cat": "Method & design", "weight": 2, "q": "Why hierarchical regression rather than SEM as the primary analysis?", "a": "Sample size and the single-item outcome make blocked regression the honest primary tool; it answers the incremental-variance question directly. A PLS-SEM sensitivity check is reported, but regression carries the main inference.", "warn": ""}, {"id": 45, "cat": "Method & design", "weight": 1, "q": "How were the vignettes constructed and validated?", "a": "Scenario-based provocations designed to elicit a hostile-response judgement, developed during instrument construction. Validation was content-based rather than empirical pilot at scale, which I note as a limitation.", "warn": "Be honest about the level of vignette piloting actually done. Do not invent a pilot study."}, {"id": 46, "cat": "Method & design", "weight": 1, "q": "Did the order of vignettes or items introduce bias?", "a": "Order effects are a possible confound; if randomisation or counterbalancing was applied, state it; if not, flag it as a limitation. I report what was actually done in the procedure.", "warn": "Check the actual procedure before answering. Do not claim counterbalancing you did not implement."}, {"id": 47, "cat": "Method & design", "weight": 1, "q": "Why single-item-per-trait personality measurement?", "a": "Brevity in an already long instrument. The TIPI lineage (Gosling, Rentfrow and Swann, 2003; Woods and Hampson, 2005) supports short Big Five measurement. Only agreeableness showed a meaningful relationship (r = -.219).", "warn": "Cite the TIPI defence proactively; examiners always probe single-item Big Five."}, {"id": 48, "cat": "Method & design", "weight": 1, "q": "What is the role of the attention check in your design?", "a": "It screened careless responding. Six respondents failed it, taking the raw 170 down to 164 valid cases. The ATU eligibility filter excluded nobody; all 170 consenting respondents were ATU students.", "warn": "Know the 170 to 164 path and that the drop was attention-check only."}, {"id": 49, "cat": "Sample & power", "weight": 3, "q": "What is your sample size, and which N applies to which analysis?", "a": "170 raw, 164 valid after the attention check. N = 164 for the DV and descriptives. n = 142 for the AI-block scales because of branching. n = 136 complete cases for the hierarchical regression. Every statistic carries its own N.", "warn": "These four numbers must be instant and exact. 170, 164, 142, 136."}, {"id": 50, "cat": "Sample & power", "weight": 2, "q": "Is n = 136 adequate for a hierarchical regression with this many predictors?", "a": "For the classic block, yes: observed power was .997. For the small AI effect it was underpowered (.243). So the design is adequate for the effects that matter and transparently underpowered for the null block.", "warn": ""}, {"id": 51, "cat": "Sample & power", "weight": 2, "q": "Did you run an a priori power analysis?", "a": "Power is reported against the observed effects via G*Power conventions (Faul et al., 2009). State the a priori target if one was set during design; if power is reported post hoc, say so honestly rather than dressing it as a priori.", "warn": "Do not claim an a priori power analysis if you only have observed/post-hoc power. Be precise."}, {"id": 52, "cat": "Sample & power", "weight": 1, "q": "Describe your sample demographics.", "a": "164 valid: 65.9% women (108), 29.9% men (49), 2.4% non-binary, 0.6% genderfluid, 1.2% prefer not to say. Demographics sit in Chapter 4, not the participants method section.", "warn": "73% female is the STALE wrong figure. The correct figure is 65.9% women."}, {"id": 53, "cat": "Sample & power", "weight": 1, "q": "How does the gender skew affect your conclusions?", "a": "A two-thirds female sample limits generalisation, particularly given gender effects in some cyber-aggression work. I treat it as a generalisability boundary and a target for the replication study.", "warn": ""}, {"id": 54, "cat": "Sample & power", "weight": 1, "q": "Why does the AI block have n = 142 while the DV has n = 164?", "a": "Branching: only respondents on the relevant survey path answered the AI-block scales. The 164 versus 142 versus 136 chain reflects attention-check loss, then branching, then listwise completeness for the regression.", "warn": ""}, {"id": 55, "cat": "Sample & power", "weight": 1, "q": "Was a student convenience sample appropriate for this question?", "a": "It suits an instrument-development and first-test study and gives a relatively AI-literate population, but it restricts range and generalisability. The follow-up uses a broader recruited sample.", "warn": ""}, {"id": 56, "cat": "Measurement & validity", "weight": 3, "q": "Report your scale reliabilities.", "a": "Aggression normalisation alpha = .67, AI trust alpha = .84, agreeableness on n = 163. Other reported alphas include OD .73, ED .75, anonymity .68, MD .79, AD .84. Composites were built with trust4 reversed and na.rm = FALSE, screened to 164.", "warn": "Aggression normalisation .67 and AI trust .84 are the corrected values. Have the full reliability table to hand."}, {"id": 57, "cat": "Measurement & validity", "weight": 2, "q": "Aggression normalisation alpha is .67, below the conventional .70. How do you defend using it?", "a": "It is marginal, not unacceptable, for a short construct scale, and I report it transparently. I treat findings involving that scale with appropriate caution and note it as a measurement limitation.", "warn": "Do not call .67 'good'. Call it marginal and report it."}, {"id": 58, "cat": "Measurement & validity", "weight": 2, "q": "What is construct validity and how did you establish it for your novel constructs?", "a": "Construct validity (Cronbach and Meehl, 1955) is whether the instrument measures the intended theoretical construct. For the novel AI constructs I established only face and content validity; convergent and discriminant validity were not formally established, which is exactly why the AI block is treated as a measurement question.", "warn": ""}, {"id": 59, "cat": "Measurement & validity", "weight": 2, "q": "How did you handle missing data?", "a": "The hierarchical regression uses n = 136 complete cases (listwise). A PLS-SEM sensitivity analysis addresses missingness and imputation separately. Composites used na.rm = FALSE so partial scales did not silently average.", "warn": ""}, {"id": 60, "cat": "Measurement & validity", "weight": 1, "q": "Why na.rm = FALSE rather than mean-imputing within a scale?", "a": "To avoid manufacturing composite scores from incomplete item sets, which would understate measurement uncertainty. A respondent missing items on a scale does not get a composite for that scale.", "warn": ""}, {"id": 61, "cat": "Measurement & validity", "weight": 1, "q": "What is the reverse-scored item issue with AI trust?", "a": "trust4 was reverse-keyed and recoded before composite construction. Failing to reverse it would have depressed the alpha and distorted the trust composite.", "warn": ""}, {"id": 62, "cat": "Measurement & validity", "weight": 1, "q": "How do you respond to a charge of questionable measurement practices?", "a": "I report all alphas, all Ns, the reverse-scoring, the missing-data rule, and the sensitivity refits, which is the transparency Flake and Fried (2020) call for. The novel-construct weakness is named, not buried.", "warn": ""}, {"id": 63, "cat": "Measurement & validity", "weight": 1, "q": "Could common-method variance inflate your correlations?", "a": "Yes; all measures are self-report in one sitting, so common-method variance is a plausible inflator. It makes the AI null more striking, not less, since shared method should if anything help the block.", "warn": ""}, {"id": 64, "cat": "Ethics & AI-use", "weight": 2, "q": "What ethical approval did this study have?", "a": "ATU Research Ethics Committee approval by email dated 12 January 2026. No separate reference number is issued; the approval email itself is the documentary evidence, reproduced in Appendix A.", "warn": "There is no REC reference number. The email IS the approval. Do not invent a number."}, {"id": 65, "cat": "Ethics & AI-use", "weight": 2, "q": "How did you use AI tools in producing this thesis, and how is that documented?", "a": "AI was used for citation work, structural auditing, raw material, code, and as a thinking partner. It did not write dissertation prose; I rewrote everything in my own voice. Usage is logged for examiners in a dedicated AI-use log.", "warn": "The clean log is a strength. Reference it confidently."}, {"id": 66, "cat": "Ethics & AI-use", "weight": 2, "q": "Given your topic is AI use, is there a conflict in using AI to produce the thesis?", "a": "No, provided it is transparent. I treat my own AI use as documented and bounded, and the distinction between AI as a research-support tool and AI as a measured construct is kept explicit.", "warn": ""}, {"id": 67, "cat": "Ethics & AI-use", "weight": 1, "q": "How did you obtain informed consent and protect participants?", "a": "Consent preceded the survey; all 170 respondents consented. Data were anonymous self-report with no sensitive identifiers, and the vignette design avoided exposing participants to real aggression.", "warn": ""}, {"id": 68, "cat": "Ethics & AI-use", "weight": 1, "q": "Were there risks in asking participants about hostile responses?", "a": "Minimal; participants rated likelihood in hypothetical scenarios rather than disclosing real perpetration, which lowers both distress and self-incrimination risk.", "warn": ""}, {"id": 69, "cat": "Ethics & AI-use", "weight": 1, "q": "How would an examiner verify your AI-use claims?", "a": "Through the AI-use log, which records what was delegated and what was authored. The supervisor constraint was that AI produced no dissertation prose, and the log evidences that.", "warn": ""}, {"id": 70, "cat": "Theory", "weight": 2, "q": "How does the General Aggression Model relate to your framework?", "a": "GAM provides the additive person-plus-situation baseline that my classic block instantiates. MIRM is positioned as an extension addressing the mediated, regulated nature of computer-mediated channels that GAM does not specify.", "warn": ""}, {"id": 71, "cat": "Theory", "weight": 2, "q": "Explain the relevance of CASA (Computers Are Social Actors) to your AI constructs.", "a": "CASA (Nass and Moon) predicts people apply social rules to computers, which underwrites treating AI interaction as socially meaningful and therefore as a plausible regulator of affect before a hostile response. It motivates the AI-venting hypothesis.", "warn": ""}, {"id": 72, "cat": "Theory", "weight": 2, "q": "How does the extended mind thesis (Clark and Chalmers) feature in your reasoning?", "a": "It supports treating AI as a cognitive and potentially affective offload, where part of the regulatory work that would normally be internal is externalised to the AI. This grounds the regulatory-substrate idea in MIRM.", "warn": ""}, {"id": 73, "cat": "Theory", "weight": 1, "q": "What is social presence theory contributing here?", "a": "Social presence (Biocca, IJsselsteijn) frames how strongly a mediated interlocutor feels present, which is the construct family the post-thesis programme develops into an AI Social Presence Scale.", "warn": ""}, {"id": 74, "cat": "Theory", "weight": 1, "q": "How does Suler's online disinhibition effect sit with your overall results?", "a": "It motivated the disinhibition and anonymity predictions, but my anonymity coefficient runs against the toxic-disinhibition reading, which is the central theoretical tension the discussion addresses.", "warn": ""}, {"id": 75, "cat": "Theory", "weight": 1, "q": "Why does the catharsis / venting hypothesis run opposite to the classic catharsis-is-a-myth literature?", "a": "Classic catharsis research concerns venting through aggression itself, which fails. AI venting is venting to a non-target interlocutor, which is closer to regulated disclosure than to aggressive rehearsal, so a protective sign is not inconsistent.", "warn": "Do not claim you have proven catharsis. The venting signal is modest and cross-sectional."}, {"id": 76, "cat": "Theory", "weight": 1, "q": "What is the I-cubed impellance term and how did you operationalise it?", "a": "Impellance is the dispositional or situational push toward aggression once instigated. I operationalised it as neuroticism, which proved empirically weak against HRL (r approx -.02), a limitation I disclose in the boundary-condition analysis.", "warn": "The impellor being empirically dead is part of the honest disclosure. Do not hide it."}, {"id": 77, "cat": "Theory", "weight": 1, "q": "How does SIDE differ from classic deindividuation theory?", "a": "Classic deindividuation says anonymity erodes self-regulation and increases anti-normative behaviour. SIDE (Reicher, Spears, Postmes) says anonymity shifts identity from personal to social and amplifies whatever group norm is salient, which can be pro- or anti-social.", "warn": ""}, {"id": 78, "cat": "Theory", "weight": 1, "q": "Why is Babel Fish Theory not in the dissertation?", "a": "Because it is an inter-personal companion framework about AI mediating between human nervous systems, targeted at a journal post-examination. It is out of scope for the dissertation, which tests MIRM only.", "warn": "Only raise BFT if the examiner does. Keep it firmly outside the thesis."}, {"id": 79, "cat": "Limitations & future work", "weight": 3, "q": "What are the three most important limitations of this study?", "a": "First, cross-sectional design cannot establish causal direction. Second, the single-item HRL outcome and the under-developed AI constructs limit measurement strength. Third, the student, female-skewed convenience sample limits generalisability and range.", "warn": "Have a crisp three. Rambling here looks like you have not thought about it."}, {"id": 80, "cat": "Limitations & future work", "weight": 2, "q": "What would you do differently if you started again?", "a": "Develop and validate the AI constructs as multi-item scales before the main study, and use a multi-item or behavioural outcome instead of a single HRL item. That directly addresses the two measurement limitations.", "warn": ""}, {"id": 81, "cat": "Limitations & future work", "weight": 2, "q": "Describe your planned three-study programme.", "a": "An escalating design: a cross-sectional survey extension adding three AI construct families, then a three-condition experimental 'Threshold Test', then an experience-sampling study. Each tightens causal inference the cross-sectional thesis cannot reach.", "warn": ""}, {"id": 82, "cat": "Limitations & future work", "weight": 2, "q": "How does the experimental study resolve the AI-block null?", "a": "By replacing weak items with developed scales and manipulating AI interaction rather than measuring it, so a persistent null would then implicate the theory rather than the instruments.", "warn": ""}, {"id": 83, "cat": "Limitations & future work", "weight": 1, "q": "What are the three new construct families in the post-thesis programme?", "a": "An AI Social Presence Scale, an AI Interaction Function Scale (emotional/venting and instrumental subscales, with a third subscale still to be finalised), and a Perceived AI Quasi-Agency Scale.", "warn": "The third AI Interaction Function subscale is not yet recovered. Say 'to be finalised', do not invent it."}, {"id": 84, "cat": "Limitations & future work", "weight": 1, "q": "What is the 'Threshold Test' experiment?", "a": "A three-condition experimental design probing whether AI interaction shifts the threshold at which provocation produces a hostile response. It is the causal test of the MIRM regulatory claim.", "warn": ""}, {"id": 85, "cat": "Limitations & future work", "weight": 1, "q": "How generalisable are your findings beyond Irish higher education?", "a": "Cautiously. The MD dominance is consistent with a broad literature and likely travels; the anonymity reversal and AI-venting signal need replication before any generalisation.", "warn": ""}, {"id": 86, "cat": "Limitations & future work", "weight": 1, "q": "What would falsify your MIRM regulatory claim?", "a": "A well-measured, well-powered study showing no AI-venting effect on hostility once cognitive-script predictors are controlled, and no experimental shift in the provocation threshold. I have specified those tests.", "warn": ""}, {"id": 87, "cat": "Limitations & future work", "weight": 1, "q": "Is experience-sampling feasible for this population, and what does it add?", "a": "It adds within-person, near-real-time coupling of AI interaction and hostility, addressing the intention-versus-behaviour and direction-of-effect gaps. Feasibility depends on compliance, which is the main risk.", "warn": ""}, {"id": 88, "cat": "Method & design", "weight": 1, "q": "How did you decide the order of blocks in the hierarchical regression?", "a": "Classic, established predictors first to set the baseline, then the novel AI block to test incremental value, then personality. The order reflects the theoretical question: does AI add anything over what we already know.", "warn": ""}, {"id": 89, "cat": "Measurement & validity", "weight": 1, "q": "Did you check regression assumptions (normality, multicollinearity, homoscedasticity)?", "a": "State what was actually checked: VIFs for multicollinearity, residual plots for normality and homoscedasticity. Report any breaches and how they were handled.", "warn": "Confirm against the actual diagnostics output before the viva. Do not claim clean assumptions blind."}, {"id": 90, "cat": "Moral disengagement", "weight": 1, "q": "Could the MD-HRL relationship be tautological, given both concern willingness to harm?", "a": "It is a fair concern, which is exactly why the md2 sensitivity analysis matters: removing the most outcome-proximal item tests whether MD predicts beyond near-tautology, and the effect survives.", "warn": ""}, {"id": 91, "cat": "Contribution & framing", "weight": 1, "q": "Summarise your results for a non-specialist in 30 seconds.", "a": "How willing people are to hit back online is driven mostly by whether they can morally excuse it, not by anonymity or by how they use AI. Venting to an AI may slightly reduce hostility, but the AI measures here were too rough to trust, so that needs proper testing.", "warn": ""}, {"id": 92, "cat": "AI-block null result", "weight": 1, "q": "What does ai_freq show in your models?", "a": "AI usage frequency was a significant negative predictor once psychological variables were controlled (beta = -.378, p = .033 in the relevant model), an isolated signal that does not rescue the block's overall null incremental variance.", "warn": "Report this as isolated, not as evidence the AI block works."}, {"id": 93, "cat": "MIRM / model comparison", "weight": 1, "q": "Why is the mediation dissociation more credible than the boundary condition?", "a": "Because it holds on the full sample with continuous controls and a clean residual test (p = .030), whereas the boundary condition holds only under a median split with a weak impellor. One is robust-ish, the other fragile, and I rank them that way.", "warn": ""}, {"id": 94, "cat": "Anonymity anomaly", "weight": 1, "q": "Does your anonymity finding undermine the rest of the thesis?", "a": "No. It is one coefficient against theory in a model where the dominant, theory-consistent effect is moral disengagement. It sharpens the discussion rather than destabilising the core finding.", "warn": ""}, {"id": 95, "cat": "CAI to HRL switch", "weight": 1, "q": "Is HRL comparable to outcomes used in the studies you cite?", "a": "Partially. It shares the response-likelihood logic of scenario-based cyber-aggression measures such as Tennakoon's, but differs in being single-item, which limits direct effect-size comparison.", "warn": ""}, {"id": 96, "cat": "Sample & power", "weight": 1, "q": "How does attrition from 142 to 136 affect the regression?", "a": "Six cases lost to listwise deletion on the regression variables. The loss is small and unlikely to bias estimates materially, but I report the complete-case N rather than masking it with imputation in the primary model.", "warn": ""}, {"id": 97, "cat": "Theory", "weight": 1, "q": "How does Walther's hyperpersonal model relate to your AI-mediation argument?", "a": "Hyperpersonal CMC shows mediated channels can intensify rather than dilute interpersonal process. By analogy, AI mediation could intensify regulatory as well as aggressive dynamics, which motivates studying its function rather than assuming a direction.", "warn": ""}, {"id": 98, "cat": "Limitations & future work", "weight": 1, "q": "If the AI constructs keep failing to predict, is the whole AI-cyber-aggression research line worth pursuing?", "a": "Yes, but as a measurement-first programme. The venting signal and the ai_freq effect suggest something is there; the responsible path is to build valid instruments before declaring the constructs predictively inert.", "warn": ""}, {"id": 99, "cat": "Contribution & framing", "weight": 1, "q": "What is the one sentence you want the examiners to remember?", "a": "Moral disengagement, not anonymity or AI use, is the engine of online hostility in this sample, and the AI question remains open because the measures, not the theory, were the limiting factor.", "warn": ""}, {"id": 100, "cat": "Limitations & future work", "weight": 1, "q": "Where do you want this research to be in five years?", "a": "A validated AI-interaction-function instrument and an experimental and experience-sampling evidence base that settles whether AI mediation genuinely modulates the provocation-to-hostility pathway, turning MIRM from a borderline cross-sectional pattern into a tested mechanism.", "warn": ""}];
</script>
<script>
var POOL=25;
var state={};
function pick(){
  // weighted draw: weight-3 strongly favoured, then 2, then 1, no repeats
  var bag=[];
  BANK.forEach(function(q){ var n=q.weight===3?4:q.weight===2?2:1; for(var i=0;i<n;i++)bag.push(q); });
  var seen={}, out=[];
  while(out.length<POOL && bag.length){
    var i=Math.floor(Math.random()*bag.length), q=bag[i];
    if(!seen[q.id]){seen[q.id]=1;out.push(q);}
    bag.splice(i,1);
  }
  // ensure all weight-3 appear if room; shuffle final order
  for(var s=out.length-1;s>0;s--){var j=Math.floor(Math.random()*(s+1));var t=out[s];out[s]=out[j];out[j]=t;}
  return out;
}
function start(){ state={set:pick(),idx:0,revealed:false,grades:{}}; render(); }
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function render(){
  var root=document.getElementById("root");
  if(state.idx>=state.set.length){ return renderEnd(root); }
  var q=state.set[state.idx], n=state.set.length, pct=Math.round(state.idx/n*100);
  var h='<div class="masthead"><div class="kicker">UCA Viva &middot; Mock Defence</div>'
    +'<h1>Question '+(state.idx+1)+'<span style="color:#b7b09a">/'+n+'</span></h1>'
    +'<div class="sub">Answer aloud first. Then reveal and grade yourself honestly.</div></div>'
    +'<div class="meterbar"><span>Progress</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span>'+pct+'%</span></div>'
    +'<div class="card"><div class="tagrow"><span class="cat">'+esc(q.cat)+'</span>'
    +(q.weight===3?'<span class="prio">High-priority &middot; exposure point</span>':'')+'</div>'
    +'<div class="qtext">'+esc(q.q)+'</div>';
  if(!state.revealed){
    h+='<div class="prompt">Say your full answer out loud, as if to the external. No notes.</div>'
      +'<div class="btnrow"><button onclick="doReveal()">Reveal model answer</button>'
      +'<button class="ghost" onclick="skip()">Skip</button></div>';
  }else{
    h+='<div class="reveal"><div class="rlabel">Model answer</div><div class="answer">'+esc(q.a)+'</div>';
    if(q.warn){ h+='<div class="warn"><b>Todd-eeze warning</b>'+esc(q.warn)+'</div>'; }
    h+='<div class="btnrow"><button class="grade g-got" onclick="grade(\'got\')">Got it</button>'
      +'<button class="grade g-shaky" onclick="grade(\'shaky\')">Shaky</button>'
      +'<button class="grade g-missed" onclick="grade(\'missed\')">Missed</button></div></div>';
  }
  h+='</div>';
  root.innerHTML=h;
}
function doReveal(){state.revealed=true;render();}
function skip(){state.idx++;state.revealed=false;render();}
function grade(g){ state.grades[state.set[state.idx].id]=g; state.idx++; state.revealed=false; render(); }
function renderEnd(root){
  var got=0,shaky=0,missed=0,bycat={};
  state.set.forEach(function(q){
    var g=state.grades[q.id]||"skip";
    if(g==="got")got++; else if(g==="shaky")shaky++; else if(g==="missed")missed++;
    if(!bycat[q.cat])bycat[q.cat]={got:0,shaky:0,missed:0,skip:0,n:0};
    bycat[q.cat][g]++; bycat[q.cat].n++;
  });
  var graded=got+shaky+missed;
  var score=graded?Math.round((got+shaky*0.5)/graded*100):0;
  var verdict = score>=80?["Defensible","var(--got)"]:score>=60?["Patchy &mdash; drill the reds","var(--shaky)"]:["Not viva-ready yet","var(--missed)"];
  var h='<div class="masthead"><div class="kicker">UCA Viva &middot; Result</div>'
    +'<h1 class="end">Round complete</h1><div class="sub">25 drawn, weighted toward your four exposure points.</div></div>'
    +'<div class="card"><h2>Readiness '+score+'%<span class="pill" style="background:'+verdict[1]+';color:#fff">'+verdict[0]+'</span></h2>'
    +'<div class="scoreline">'
    +'Got it &nbsp;<span class="pill" style="background:var(--got);color:#fff">'+got+'</span><br>'
    +'Shaky &nbsp;<span class="pill" style="background:var(--shaky);color:#fff">'+shaky+'</span><br>'
    +'Missed &nbsp;<span class="pill" style="background:var(--missed);color:#fff">'+missed+'</span></div>';
  h+='<div class="catbreak"><div class="rlabel">By category &mdash; where the gaps are</div>';
  Object.keys(bycat).sort().forEach(function(c){
    var b=bycat[c], tot=b.n;
    function w(x){return tot?(x/tot*100):0;}
    h+='<div class="catrow"><div class="catname">'+esc(c)+'</div><div class="catbar">'
      +'<div class="seg" style="width:'+w(b.got)+'%;background:var(--got)"></div>'
      +'<div class="seg" style="width:'+w(b.shaky)+'%;background:var(--shaky)"></div>'
      +'<div class="seg" style="width:'+w(b.missed)+'%;background:var(--missed)"></div>'
      +'<div class="seg" style="width:'+w(b.skip)+'%;background:var(--paper2)"></div>'
      +'</div></div>';
  });
  h+='</div>';
  h+='<div class="footnote">Scoring weights Got it = 1, Shaky = 0.5, Missed/Skip = 0. A viva is not multiple-choice: the test is whether you said the number, the p-value and the disclosure out loud before revealing. Reds in Anonymity anomaly, CAI to HRL, AI-block null or MIRM are the ones that cost marks in the room.</div>';
  h+='<div class="btnrow"><button onclick="start()">New 25 &mdash; reshuffle</button></div>';
  h+='</div>';
  root.innerHTML=h;
}
start();
</script>
